model:
  name: resnet50
  keras_application: ResNet50
  imagenet_pretrained: true
  input_size:
  - 299
  - 299
  dense_units: 2048
  dropout: 0.5
  trainable_last_layers: 200
data:
  train_dataset: HAM10000
  external_test_dataset: BOSQUE_public
  ham10000_root: data/raw
  ham10000_metadata: data/raw/HAM10000_metadata.csv
  bosque_root: data/external/bosque_public
  benign_labels:
  - nv
  - bkl
  - df
  - vasc
  malignant_labels:
  - mel
  - bcc
  - akiec
  light_phototypes:
  - 1
  - 2
  - 3
  dark_phototypes:
  - 4
  - 5
  - 6
split:
  manifest_path: splits/ham10000_lesion_grouped_fixed.csv
training:
  batch_size: 16
  epochs: 200
  optimizer: adam
  learning_rate: 1.0e-06
  loss: binary_crossentropy
  early_stopping_monitor: val_loss
  early_stopping_patience: 15
  oversampling: train_only
  seeds:
  - 347535239
  - 1431725881
  - 3368960919
  - 4236551057
  - 780568470
evaluation:
  threshold: 0.5
  metrics:
  - accuracy
  - precision
  - recall
  - specificity
  - f1
  - auc_roc
  - auc_pr
outputs:
  models_dir: outputs/models
  predictions_dir: outputs/predictions
  tables_dir: outputs/tables
  figures_dir: outputs/figures
  logs_dir: outputs/logs
